apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: "https://github.com/ramawisesaa/learn.git"
    - name: branch
      value: "main"
  workspaces:
    - name: pipeline-shared-workspace
      persistentVolumeClaim:
        claimName: app-pvc
