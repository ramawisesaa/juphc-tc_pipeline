apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-install-and-test
spec:
  steps:
    - name: npm
      image: node:16
      script: |
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine-test
spec:
  steps:
    - name: jasmine
      image: node:16
      script: |
        npx jasmine
