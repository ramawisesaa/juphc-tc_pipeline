apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  tasks:
    - name: npminstall
      taskRef:
        name: npm-install-and-test
    - name: tests
      taskRef:
        name: jasmine-test
      runAfter:
        - npminstall
    - name: build
      taskRef:
        name: build-task
      runAfter:
        - tests
